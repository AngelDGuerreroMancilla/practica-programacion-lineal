<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programación Lineal - Método gráfico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>canvas{max-width:100%;border:1px solid #ccc;border-radius:6px;background:#fff}</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h3 class="mb-3">Programación Lineal – Método gráfico (2 variables)</h3>

  <div class="card mb-3"><div class="card-body py-2">
    <div class="mb-2">
      <span class="me-2">Ejercicios:</span>
      <button class="btn btn-outline-primary btn-sm" onclick="cargar(1)">Problema 1 (Pinturas)</button>
      <button class="btn btn-outline-success btn-sm" onclick="cargar(2)">Problema 2 (Alimento)</button>
     
      <button class="btn btn-dark btn-sm" onclick="nuevo()">+ Nuevo problema (en blanco)</button>
    </div>
    <div class="row g-2 align-items-center">
      <div class="col-md-5"><div class="input-group input-group-sm">
         <label for="nombreProb" class="form-label">Nombre del problema: </label>
          <br>
        <input id="nombreProb" class="form-control" placeholder="Problema 1"><span class="input-group-text"> </span>
        <button class="btn btn-warning" onclick="guardar()">Guardar</button></div></div>
      <div class="col-md-7"><div class="input-group input-group-sm">
        <span class="input-group-text">Mis problemas</span>
        <select id="misProb" class="form-select"></select>
        <button class="btn btn-outline-primary" onclick="cargarGuardado()">Cargar</button>
        <button class="btn btn-outline-danger" onclick="borrarGuardado()">Eliminar</button></div></div>
    </div>
  </div></div>

  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card"><div class="card-body">
        <h6>1. Variables</h6>
        <div class="row g-2 mb-3">
          <div class="col"><input id="n1" class="form-control" placeholder="Nombre X"></div>
          <div class="col"><input id="n2" class="form-control" placeholder="Nombre Y"></div>
        </div>
        <h6>2. Función objetivo</h6>
        <div class="input-group mb-3">
          <select id="tipo" class="form-select" style="max-width:110px"><option value="max">Maximizar</option><option value="min">Minimizar</option></select>
          <span class="input-group-text">Z =</span>
          <input id="c1" type="number" step="any" class="form-control"><span class="input-group-text">X +</span>
          <input id="c2" type="number" step="any" class="form-control"><span class="input-group-text">Y</span>
        </div>
        <h6>3. Restricciones <small class="text-muted">(X, Y ≥ 0 se agrega automáticamente)</small></h6>
        <div id="restr"></div>
        <button class="btn btn-sm btn-secondary mt-1" onclick="addRow()">+ Restricción</button>
        <button class="btn btn-primary btn-sm mt-1 float-end" onclick="resolver()">Resolver y graficar</button>
      </div></div>
    </div>
    <div class="col-lg-7">
      <div class="card"><div class="card-body text-center">
        <h6 class="text-start">4-5. Gráfica y área factible</h6>
        <canvas id="cv" width="680" height="500"></canvas>
      </div></div>
    </div>
  </div>

  <div class="card mt-3"><div class="card-body" id="salida"><span class="text-muted">Presiona "Resolver y graficar".</span></div></div>
</div>

<script src="./operaciones.js"></script>

</body>
</html>
